name: wallet
description: "E-Global Wallet Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_inappwebview: ^6.1.5
  permission_handler: ^12.0.3
  connectivity_plus: ^7.3.1
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.1
  share_plus: ^10.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  background_image: "assets/images/splash_bg.png"
  background_image_dark: "assets/images/splash_bg.png"
  fullscreen: true
  android_gravity: fill
  ios_content_mode: scaleToFill

  android_12:
    color: "#f67c01"
    image: "assets/images/logo.png"
    color_dark: "#f67c01"
    image_dark: "assets/images/logo.png"

  ios: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/splash_bg.png
