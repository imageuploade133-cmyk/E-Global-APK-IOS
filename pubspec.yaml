name: wallet
description: "E-Global Wallet Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_inappwebview: ^6.1.5
  permission_handler: ^12.0.3
  connectivity_plus: ^7.3.1
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
