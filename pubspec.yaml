name: wallet
description: "E-Global Pay Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_inappwebview: ^6.1.5
  permission_handler: ^12.0.3
  connectivity_plus: ^7.3.1
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.1
  share_plus: ^10.1.1
  url_launcher: ^6.3.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  flutter_badge: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logo.png"
  color_dark: "#FFFFFF"
  image_dark: "assets/images/logo.png"
  fullscreen: true

  android_12:
    color: "#FFFFFF"
    image: "assets/images/logo.png"
    color_dark: "#FFFFFF"
    image_dark: "assets/images/logo.png"

  ios: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
